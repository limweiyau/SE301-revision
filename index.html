    <div class="container nav-inner">
      <a class="brand" href="index.html">SE301 <span>Revision</span></a>
      <button id="nav-toggle" class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" fill="none">
          <path d="M3 4.5H15M3 9H15M3 13.5H15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <ul id="nav-links" class="nav-links">

  <footer class="container">

  </footer>

  <script>
    (function () {
      var navbar = document.querySelector("header.navbar");
      var btn = document.getElementById("nav-toggle");
      var links = document.getElementById("nav-links");
      if (!navbar || !btn || !links) return;
      function close() {
        navbar.classList.remove("open");
        btn.setAttribute("aria-expanded", "false");
      }
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var open = navbar.classList.toggle("open");
        btn.setAttribute("aria-expanded", String(open));
      });
      document.addEventListener("click", function (e) {
        if (navbar.classList.contains("open") && !navbar.contains(e.target)) close();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") close();
      });
    })();
  </script>
</body>
</html>
